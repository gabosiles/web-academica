<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería con Lightbox Avanzado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    /* --- Miniaturas --- */
    .galeria {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .galeria img {
      width: 120px;
      height: 90px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.2s;
    }

    .galeria img:hover {
      transform: scale(1.1);
    }

    /* --- Fondo opaco del visor --- */
    .lightbox {
      display: none; 
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    /* --- Contenedor de imagen + texto --- */
    .lightbox-content {
      display: flex;
      gap: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 80%;
      max-height: 80%;
      align-items: center;
      position: relative;
    }

    .lightbox-content img {
      max-width: 500px;
      border-radius: 10px;
    }

    .descripcion {
      max-width: 300px;
      font-size: 16px;
    }

    /* --- Botón cerrar --- */
    .cerrar {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      z-index: 1100;
    }

    /* --- Botones de navegación --- */
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 50px;
      color: white;
      cursor: pointer;
      user-select: none;
      padding: 10px;
      z-index: 1100;
    }

    .nav.izquierda {
      left: 20px;
    }

    .nav.derecha {
      right: 20px;
    }

  </style>
</head>
<body>

  <h1>Galería de Imágenes</h1>

  <!-- 🔹 Miniaturas -->
  <div class="galeria">
    <img src="./assets/img/perfiles/0.jpg" alt="Imagen 1" onclick="abrirLightbox(0)">
    <img src="./assets/img/perfiles/1.jpg" alt="Imagen 2" onclick="abrirLightbox(1)">
    <img src="./assets/img/perfiles/2.jpg" alt="Imagen 3" onclick="abrirLightbox(2)">
    <img src="./assets/img/perfiles/3.jpg" alt="Imagen 4" onclick="abrirLightbox(3)">
  </div>

  <!-- 🔹 Lightbox -->
  <div class="lightbox" id="lightbox" onclick="cerrarSiFondo(event)">
    <span class="cerrar" onclick="cerrarLightbox()">&times;</span>
    <span class="nav izquierda" onclick="cambiarImagen(-1)">&#10094;</span>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Imagen grande">
      <div class="descripcion" id="lightbox-texto"></div>
    </div>
    <span class="nav derecha" onclick="cambiarImagen(1)">&#10095;</span>
  </div>

  <script>
    // Lista de imágenes y descripciones
    const imagenes = [
      {src: "./assets/img/perfiles/0.jpg", texto: "Descripción de la primera imagen."},
      {src: "./assets/img/perfiles/1.jpg", texto: "Texto de la segunda imagen."},
      {src: "./assets/img/perfiles/2.jpg", texto: "Explicación de la tercera imagen."},
      {src: "./assets/img/perfiles/3.jpg", texto: "Detalle de la cuarta imagen."}
    ];

    let indiceActual = 0;

    function abrirLightbox(indice) {
      indiceActual = indice;
      document.getElementById("lightbox").style.display = "flex";
      mostrarImagen();
    }

    function mostrarImagen() {
      document.getElementById("lightbox-img").src = imagenes[indiceActual].src;
      document.getElementById("lightbox-texto").innerText = imagenes[indiceActual].texto;
    }

    function cambiarImagen(direccion) {
      indiceActual += direccion;
      if (indiceActual < 0) indiceActual = imagenes.length - 1;
      if (indiceActual >= imagenes.length) indiceActual = 0;
      mostrarImagen();
    }

    function cerrarLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }

    // Cierra si clickean fuera del contenido
    function cerrarSiFondo(event) {
      if (event.target.id === "lightbox") {
        cerrarLightbox();
      }
    }

    // Navegación con teclas ← →
    document.addEventListener("keydown", function(e) {
      if (document.getElementById("lightbox").style.display === "flex") {
        if (e.key === "ArrowRight") cambiarImagen(1);
        if (e.key === "ArrowLeft") cambiarImagen(-1);
        if (e.key === "Escape") cerrarLightbox();
      }
    });
  </script>

</body>
</html>
